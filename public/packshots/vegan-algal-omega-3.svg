<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="Vegan Algal Omega-3 concept packshot (demo only)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF6F2"/>
      <stop offset="100%" stop-color="#F4E4DC"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F7C5B8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F7C5B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B2015"/>
      <stop offset="30%" stop-color="#6B301E"/>
      <stop offset="72%" stop-color="#4E2115"/>
      <stop offset="100%" stop-color="#2D110B"/>
    </linearGradient>
    <linearGradient id="plumGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261124"/>
      <stop offset="35%" stop-color="#452141"/>
      <stop offset="75%" stop-color="#2B1429"/>
      <stop offset="100%" stop-color="#190A18"/>
    </linearGradient>
    <linearGradient id="tubBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="38%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>

  <!-- Studio backdrop -->
  <rect width="600" height="620" rx="28" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="240" fill="url(#aura)"/>
  

  <!-- Concept pack disclosure stamp on studio backdrop -->
  <g transform="translate(422, 36)">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#FFFDF9" stroke="#C7B4A0" stroke-width="1.2"/>
    <text x="71" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#593C55" letter-spacing="0.9">CONCEPT PACK · DEMO</text>
  </g>

  
      <ellipse cx="300" cy="546" rx="116" ry="16" fill="#261124" opacity="0.14"/>
      <!-- Satin tall cap -->
      <rect x="232" y="88" width="136" height="62" rx="12" fill="#2B1429"/>
      <rect x="232" y="138" width="136" height="10" fill="#C8432B"/>
      <!-- Flacon body -->
      <path d="M238 150 C206 168, 188 192, 188 224 L188 510 C188 530, 204 542, 224 542 L376 542 C396 542, 412 530, 412 510 L412 224 C412 192, 394 168, 362 150 Z" fill="url(#plumGlass)"/>
      <path d="M204 214 L204 518" stroke="#FFFDF9" stroke-width="7" stroke-linecap="round" opacity="0.24"/>
    

  <!-- Wraparound Apothecary Label -->
  <g>
    <rect x="196" y="222" width="208" height="266" rx="8" fill="#FFFDF9" stroke="#E3D7C8" stroke-width="1.2"/>
    <!-- Top collection colour stripe -->
    <rect x="196" y="222" width="208" height="8" rx="3" fill="#C8432B"/>

    <!-- Brand header + FSSAI Veg/Non-Veg emblem -->
    <text x="210" y="251" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#261124" letter-spacing="1.4">GOODFORM</text>
    <text x="210" y="265" font-family="ui-monospace, monospace" font-size="9" fill="#593C55" letter-spacing="1.1">OMEGA · GF-OMG-003</text>
    
    <g transform="translate(372, 238)">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#FFFDF9" stroke="#1D6A3B" stroke-width="1.8"/>
      <circle cx="9" cy="9" r="4.5" fill="#1D6A3B"/>
    </g>
  

    <line x1="210" y1="275" x2="390" y2="275" stroke="#E3D7C8" stroke-width="1"/>

    <!-- Product Display Name -->
    <text x="210" y="302" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Vegan Algal Omega-3</text>
    

    <!-- Subtitle -->
    <text x="210" y="325" font-family="system-ui, sans-serif" font-size="10.5" fill="#593C55">Schizochytrium sp. Microalgae DHA &amp; EPA</text>

    <!-- Elemental Dose Pill -->
    <rect x="210" y="402" width="180" height="32" rx="6" fill="#F3ECE1" stroke="#DFD2C0"/>
    <text x="220" y="422" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#261124">500 mg DHA + EPA</text>

    <!-- Mandatory Front Disclaimer -->
    <text x="210" y="450" font-family="ui-monospace, monospace" font-size="8.5" fill="#593C55" letter-spacing="0.5">HEALTH SUPPLEMENT · DEMO LABEL</text>

    
      <rect x="196" y="460" width="208" height="28" fill="#C8432B"/>
      <text x="210" y="478" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#FFFDF9" letter-spacing="0.8">60 PLANT SOFTGELS · 30 SERVINGS</text>
    
  </g>
</svg>
