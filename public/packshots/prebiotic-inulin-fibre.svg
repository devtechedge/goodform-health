<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="Prebiotic Inulin Fibre concept packshot (demo only)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6FAF7"/>
      <stop offset="100%" stop-color="#E3EFE8"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#BFE3D0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#BFE3D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B2015"/>
      <stop offset="30%" stop-color="#6B301E"/>
      <stop offset="72%" stop-color="#4E2115"/>
      <stop offset="100%" stop-color="#2D110B"/>
    </linearGradient>
    <linearGradient id="plumGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261124"/>
      <stop offset="35%" stop-color="#452141"/>
      <stop offset="75%" stop-color="#2B1429"/>
      <stop offset="100%" stop-color="#190A18"/>
    </linearGradient>
    <linearGradient id="tubBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="38%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>

  <!-- Studio backdrop -->
  <rect width="600" height="620" rx="28" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="240" fill="url(#aura)"/>
  

  <!-- Concept pack disclosure stamp on studio backdrop -->
  <g transform="translate(422, 36)">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#FFFDF9" stroke="#C7B4A0" stroke-width="1.2"/>
    <text x="71" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#593C55" letter-spacing="0.9">CONCEPT PACK · DEMO</text>
  </g>

  
      <ellipse cx="300" cy="544" rx="154" ry="18" fill="#261124" opacity="0.15"/>
      <!-- Wide canister lid -->
      <rect x="156" y="122" width="288" height="44" rx="10" fill="#2B1429"/>
      <rect x="166" y="164" width="268" height="14" fill="#3F213D"/>
      <!-- Matte ivory/stone tub body -->
      <rect x="152" y="176" width="296" height="362" rx="28" fill="url(#tubBody)" stroke="#D9CBB9" stroke-width="2"/>
      <path d="M172 196 L172 518" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
    

  <!-- Wraparound Apothecary Label -->
  <g>
    <rect x="162" y="224" width="276" height="256" rx="8" fill="#FFFDF9" stroke="#E3D7C8" stroke-width="1.2"/>
    <!-- Top collection colour stripe -->
    <rect x="162" y="224" width="276" height="8" rx="3" fill="#21573E"/>

    <!-- Brand header + FSSAI Veg/Non-Veg emblem -->
    <text x="176" y="253" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#261124" letter-spacing="1.4">GOODFORM</text>
    <text x="176" y="267" font-family="ui-monospace, monospace" font-size="9" fill="#593C55" letter-spacing="1.1">GUT · GF-GUT-031</text>
    
    <g transform="translate(406, 240)">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#FFFDF9" stroke="#1D6A3B" stroke-width="1.8"/>
      <circle cx="9" cy="9" r="4.5" fill="#1D6A3B"/>
    </g>
  

    <line x1="176" y1="277" x2="424" y2="277" stroke="#E3D7C8" stroke-width="1"/>

    <!-- Product Display Name -->
    <text x="176" y="304" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Prebiotic Inulin</text>
    <text x="176" y="327" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Fibre</text>

    <!-- Subtitle -->
    <text x="176" y="347" font-family="system-ui, sans-serif" font-size="10.5" fill="#593C55">Chicory Root Oligofructose-Enriched Inulin</text>

    <!-- Elemental Dose Pill -->
    <rect x="176" y="394" width="248" height="32" rx="6" fill="#F3ECE1" stroke="#DFD2C0"/>
    <text x="186" y="414" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#261124">5 g Prebiotic Inulin</text>

    <!-- Mandatory Front Disclaimer -->
    <text x="176" y="442" font-family="ui-monospace, monospace" font-size="8.5" fill="#593C55" letter-spacing="0.5">HEALTH SUPPLEMENT · DEMO LABEL</text>

    
      <rect x="162" y="452" width="276" height="28" fill="#21573E"/>
      <text x="176" y="470" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#F6FBF8" letter-spacing="0.8">250 G CANISTER · 50 SERVINGS</text>
    
  </g>
</svg>
