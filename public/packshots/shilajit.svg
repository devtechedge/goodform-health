<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="Shilajit concept packshot (demo only)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCF6F2"/>
      <stop offset="100%" stop-color="#F1E3DA"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F5C2B4" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F5C2B4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B2015"/>
      <stop offset="30%" stop-color="#6B301E"/>
      <stop offset="72%" stop-color="#4E2115"/>
      <stop offset="100%" stop-color="#2D110B"/>
    </linearGradient>
    <linearGradient id="plumGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261124"/>
      <stop offset="35%" stop-color="#452141"/>
      <stop offset="75%" stop-color="#2B1429"/>
      <stop offset="100%" stop-color="#190A18"/>
    </linearGradient>
    <linearGradient id="tubBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="38%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>

  <!-- Studio backdrop -->
  <rect width="600" height="620" rx="28" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="240" fill="url(#aura)"/>
  

  <!-- Concept pack disclosure stamp on studio backdrop -->
  <g transform="translate(422, 36)">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#FFFDF9" stroke="#C7B4A0" stroke-width="1.2"/>
    <text x="71" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#593C55" letter-spacing="0.9">CONCEPT PACK · DEMO</text>
  </g>

  
      <ellipse cx="300" cy="536" rx="142" ry="17" fill="#261124" opacity="0.16"/>
      <rect x="184" y="196" width="232" height="44" rx="10" fill="#231021"/>
      <rect x="164" y="240" width="272" height="288" rx="34" fill="url(#plumGlass)"/>
      <path d="M184 264 L184 502" stroke="#FFF6EB" stroke-width="7" stroke-linecap="round" opacity="0.2"/>
    

  <!-- Wraparound Apothecary Label -->
  <g>
    <rect x="174" y="274" width="252" height="210" rx="8" fill="#FFFDF9" stroke="#E3D7C8" stroke-width="1.2"/>
    <!-- Top collection colour stripe -->
    <rect x="174" y="274" width="252" height="8" rx="3" fill="#B83B24"/>

    <!-- Brand header + FSSAI Veg/Non-Veg emblem -->
    <text x="188" y="303" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#261124" letter-spacing="1.4">GOODFORM</text>
    <text x="188" y="317" font-family="ui-monospace, monospace" font-size="9" fill="#593C55" letter-spacing="1.1">ACTIVE · GF-ACT-027</text>
    
    <g transform="translate(394, 290)">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#FFFDF9" stroke="#1D6A3B" stroke-width="1.8"/>
      <circle cx="9" cy="9" r="4.5" fill="#1D6A3B"/>
    </g>
  

    <line x1="188" y1="327" x2="412" y2="327" stroke="#E3D7C8" stroke-width="1"/>

    <!-- Product Display Name -->
    <text x="188" y="354" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Shilajit</text>
    

    <!-- Subtitle -->
    <text x="188" y="377" font-family="system-ui, sans-serif" font-size="10.5" fill="#593C55">Purified Himalayan Exudate Resin</text>

    <!-- Elemental Dose Pill -->
    <rect x="188" y="398" width="224" height="32" rx="6" fill="#F3ECE1" stroke="#DFD2C0"/>
    <text x="198" y="418" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#261124">250 mg Resin Measure</text>

    <!-- Mandatory Front Disclaimer -->
    <text x="188" y="446" font-family="ui-monospace, monospace" font-size="8.5" fill="#593C55" letter-spacing="0.5">HEALTH SUPPLEMENT · DEMO LABEL</text>

    
      <rect x="174" y="454" width="252" height="30" rx="4" fill="#734304"/>
      <text x="300" y="473" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FDF0D5" letter-spacing="1.2">HOLD · LEGAL REVIEW</text>
    
  </g>
</svg>
