<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="Liposomal Vitamin C concept packshot (demo only)">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF9F0"/>
      <stop offset="100%" stop-color="#F3E7CF"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F2D8A7" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#F2D8A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4B2015"/>
      <stop offset="30%" stop-color="#6B301E"/>
      <stop offset="72%" stop-color="#4E2115"/>
      <stop offset="100%" stop-color="#2D110B"/>
    </linearGradient>
    <linearGradient id="plumGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#261124"/>
      <stop offset="35%" stop-color="#452141"/>
      <stop offset="75%" stop-color="#2B1429"/>
      <stop offset="100%" stop-color="#190A18"/>
    </linearGradient>
    <linearGradient id="tubBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EFE6"/>
      <stop offset="38%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
  </defs>

  <!-- Studio backdrop -->
  <rect width="600" height="620" rx="28" fill="url(#bgGrad)"/>
  <circle cx="300" cy="270" r="240" fill="url(#aura)"/>
  

  <!-- Concept pack disclosure stamp on studio backdrop -->
  <g transform="translate(422, 36)">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#FFFDF9" stroke="#C7B4A0" stroke-width="1.2"/>
    <text x="71" y="18" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#593C55" letter-spacing="0.9">CONCEPT PACK · DEMO</text>
  </g>

  
      <ellipse cx="300" cy="542" rx="138" ry="16" fill="#261124" opacity="0.14"/>
      <!-- Stick sachets peeking from apothecary caddy -->
      <rect x="208" y="92" width="52" height="90" rx="6" transform="rotate(-6 208 92)" fill="#C8432B"/>
      <rect x="274" y="84" width="52" height="96" rx="6" fill="#2B1429"/>
      <rect x="336" y="94" width="52" height="88" rx="6" transform="rotate(6 336 94)" fill="#EAE1F7" stroke="#C9B6E8"/>
      <!-- Architectural caddy -->
      <rect x="166" y="156" width="268" height="380" rx="18" fill="url(#tubBody)" stroke="#CBBBA7" stroke-width="2"/>
      <rect x="166" y="156" width="268" height="22" rx="8" fill="#2B1429"/>
    

  <!-- Wraparound Apothecary Label -->
  <g>
    <rect x="176" y="204" width="248" height="286" rx="8" fill="#FFFDF9" stroke="#E3D7C8" stroke-width="1.2"/>
    <!-- Top collection colour stripe -->
    <rect x="176" y="204" width="248" height="8" rx="3" fill="#8A520A"/>

    <!-- Brand header + FSSAI Veg/Non-Veg emblem -->
    <text x="190" y="233" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#261124" letter-spacing="1.4">GOODFORM</text>
    <text x="190" y="247" font-family="ui-monospace, monospace" font-size="9" fill="#593C55" letter-spacing="1.1">VITAMINS · GF-VIT-013</text>
    
    <g transform="translate(392, 220)">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#FFFDF9" stroke="#1D6A3B" stroke-width="1.8"/>
      <circle cx="9" cy="9" r="4.5" fill="#1D6A3B"/>
    </g>
  

    <line x1="190" y1="257" x2="410" y2="257" stroke="#E3D7C8" stroke-width="1"/>

    <!-- Product Display Name -->
    <text x="190" y="284" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Liposomal C</text>
    <text x="190" y="307" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#261124">Vitamin</text>

    <!-- Subtitle -->
    <text x="190" y="327" font-family="system-ui, sans-serif" font-size="10.5" fill="#593C55">Sunflower Lecithin Encapsulated Sodium A...</text>

    <!-- Elemental Dose Pill -->
    <rect x="190" y="404" width="220" height="32" rx="6" fill="#F3ECE1" stroke="#DFD2C0"/>
    <text x="200" y="424" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#261124">500 mg Liposomal C</text>

    <!-- Mandatory Front Disclaimer -->
    <text x="190" y="452" font-family="ui-monospace, monospace" font-size="8.5" fill="#593C55" letter-spacing="0.5">HEALTH SUPPLEMENT · DEMO LABEL</text>

    
      <rect x="176" y="462" width="248" height="28" fill="#8A520A"/>
      <text x="190" y="480" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#FFFDF9" letter-spacing="0.8">30 LIQUID SACHETS · 30 SERVINGS</text>
    
  </g>
</svg>
